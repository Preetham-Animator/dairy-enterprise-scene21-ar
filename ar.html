<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07131f"><title>Scene 21 True AR</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b10;color:#fff;font-family:Inter,system-ui,Arial}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;z-index:5;pointer-events:none}.glass{background:rgba(5,22,35,.91);border:1px solid rgba(105,221,255,.48);backdrop-filter:blur(14px);box-shadow:0 16px 45px #0006}.brand{position:absolute;left:12px;top:12px;padding:9px 12px;border-radius:14px;font-size:10px;font-weight:800}.guide{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(570px,calc(100vw - 230px));padding:10px;border-radius:13px;text-align:center;font-size:9px}.launch{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100vw - 28px));padding:24px;border-radius:23px;text-align:center}.launch.hide{display:none}.launch h1{font-size:22px;margin:0 0 8px}.launch p{font-size:10px;color:#aec3cf;line-height:1.5}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 14px;border-radius:12px;border:1px solid #4f91ae;background:#0b2638;color:#fff;font-size:9px;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(#ffd45a,#ffb81c);border-color:#ffb81c;color:#07131f}.btn:disabled{opacity:.35}.note{margin-top:12px;font-size:8px;color:#ffdca0}.status{position:absolute;left:12px;bottom:12px;padding:9px 11px;border-radius:13px;font-size:8px}.back{position:absolute;right:12px;top:12px;pointer-events:auto}.toast{position:absolute;right:12px;bottom:12px;max-width:330px;padding:10px;border-radius:13px;font-size:8px;color:#dcecf3;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:650px){.guide{top:64px;width:calc(100vw - 20px)}.brand{left:8px;top:8px}.back{right:8px;top:8px}.status{left:8px;bottom:8px}.toast{right:8px;bottom:54px}}</style></head><body><canvas id="xr"></canvas><div class="ui"><div class="brand glass">AR · Dairy Enterprise Checklist</div><div class="guide glass" id="guide">Checking WebXR support…</div><a class="btn back" href="index.html">Back to Preview</a><section class="launch glass" id="launch"><h1>True AR Placement</h1><p>Move the tablet slowly over a table or workbook page. When the cyan reticle appears, tap once to place the world-locked checklist.</p><button class="btn primary" id="start" disabled>Start True AR</button><div class="note" id="note">Checking HTTPS + immersive-ar…</div></section><div class="status glass" id="status">Checking device…</div><div class="toast glass" id="toast"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.min.js';const $=id=>document.getElementById(id),renderer=new THREE.WebGLRenderer({canvas:$('xr'),alpha:true,antialias:true,powerPreference:'high-performance'});renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,25);scene.add(new THREE.HemisphereLight(0xffffff,0x223344,2));const M=[['Eligibility & Needs','Land · Water · Capital · Market','🏠'],['Opportunities & Challenges','Income · Schemes · Risk · Feed cost','📈'],['Supporting Activities','Fodder · Vet/AI · Co-op · Transport','🤝'],['Readiness Summary','Resources · Risk · Planning · Support','✅']],FACTS=[['Land / shed and fodder space','Reliable water supply','Starting capital / suitable animals','Milk market access'],['Steady milk income','Government support / schemes','Disease and vet-access risk','Feed-cost / milk-price changes'],['Fodder cultivation and silage','Veterinary care and AI','Milk cooperative support','Transport and logistics'],['Resources are ready','Risks are understood','Business plan and records','Support network connected']];const cv=document.createElement('canvas');cv.width=1600;cv.height=950;const c=cv.getContext('2d'),rects=[];function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function draw(active=-1){c.clearRect(0,0,1600,950);let g=c.createLinearGradient(0,0,0,950);g.addColorStop(0,'#0a304d');g.addColorStop(1,'#041522');c.fillStyle=g;rr(15,15,1570,920,45);c.fill();c.strokeStyle='#65dfff';c.lineWidth=5;c.stroke();c.fillStyle='#fff';c.font='800 46px system-ui';c.fillText('DAIRY ENTERPRISE SETUP CHECKLIST',60,82);c.fillStyle='#afc4d0';c.font='22px system-ui';c.fillText('Tap a milestone to revisit a short fact.',60,122);rects.length=0;M.forEach((d,i)=>{let x=60+(i%2)*760,y=170+Math.floor(i/2)*345,w=700,h=295;c.fillStyle=i===active?'#3b392d':'#102e45';rr(x,y,w,h,34);c.fill();c.strokeStyle=i===active?'#ffbd2e':['#38bfff','#45d8c1','#a283ff','#4bd797'][i];c.lineWidth=i===active?7:4;c.stroke();c.font='88px system-ui';c.fillText(d[2],x+38,y+128);c.fillStyle='#fff';c.font='800 30px system-ui';c.fillText(d[0],x+158,y+90);c.fillStyle='#b7cbd5';c.font='20px system-ui';c.fillText(d[1],x+158,y+142);c.fillStyle='#ffd45a';c.font='800 17px system-ui';c.fillText('TAP TO REVISIT',x+158,y+215);rects.push({x,y,w,h,i})});tex.needsUpdate=true}const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const reticle=new THREE.Mesh(new THREE.RingGeometry(.055,.078,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x70e5ff,side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);const root=new THREE.Group();root.visible=false;scene.add(root);const board=new THREE.Mesh(new THREE.PlaneGeometry(.96,.57),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));board.position.y=.39;root.add(board);const halo=new THREE.Mesh(new THREE.RingGeometry(.24,.28,64).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x70e5ff,transparent:true,opacity:.55,side:THREE.DoubleSide}));root.add(halo);draw();let session,viewer,hitSource,lastPose,placed=false;const raycaster=new THREE.Raycaster();function status(s){$('status').textContent=s}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),3500)}async function preflight(){if(!isSecureContext){$('note').textContent='HTTPS required.';status('HTTPS required');return}if(!navigator.xr){$('note').textContent='WebXR API unavailable.';status('WebXR unavailable');return}let ok=false;try{ok=await navigator.xr.isSessionSupported('immersive-ar')}catch{}if(!ok){$('note').textContent='immersive-ar not supported on this browser/device.';status('True AR unsupported here');$('guide').textContent='Use an ARCore/WebXR-supported Android tablet/phone.';return}$('start').disabled=false;$('note').textContent='HTTPS + immersive-ar detected.';status('True AR ready');$('guide').textContent='Start AR, scan a flat surface, then tap the cyan reticle.'}function ray(e){const ref=renderer.xr.getReferenceSpace();const p=e.frame.getPose(e.inputSource.targetRaySpace,ref);if(!p)return null;const m=new THREE.Matrix4().fromArray(p.transform.matrix);return{origin:new THREE.Vector3().setFromMatrixPosition(m),direction:new THREE.Vector3(0,0,-1).transformDirection(m)}}function select(e){if(!placed){if(reticle.visible&&lastPose){const m=new THREE.Matrix4().fromArray(lastPose.transform.matrix),p=new THREE.Vector3().setFromMatrixPosition(m),cp=new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera(camera).matrixWorld);root.position.copy(p);root.rotation.set(0,Math.atan2(cp.x-p.x,cp.z-p.z),0);root.visible=true;reticle.visible=false;placed=true;status('Checklist anchored — tap milestones');$('guide').textContent='Move around it; the checklist should stay fixed in the real world.'}return}const r=ray(e);if(!r)return;raycaster.set(r.origin,r.direction);const h=raycaster.intersectObject(board,false);if(!h.length||!h[0].uv)return;const x=h[0].uv.x*1600,y=(1-h[0].uv.y)*950,card=rects.find(q=>x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h);if(card){draw(card.i);toast(M[card.i][0]+': '+FACTS[card.i].join(' · '))}}$('start').onclick=async()=>{try{$('launch').classList.add('hide');session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test']});await renderer.xr.setSession(session);viewer=await session.requestReferenceSpace('viewer');hitSource=await session.requestHitTestSource({space:viewer});session.addEventListener('select',select);session.addEventListener('end',()=>{renderer.setAnimationLoop(null);root.visible=false;reticle.visible=false;placed=false;$('launch').classList.remove('hide');status('AR session ended')});renderer.setAnimationLoop((t,f)=>{if(f&&hitSource&&!placed){const ref=renderer.xr.getReferenceSpace(),hits=f.getHitTestResults(hitSource);if(hits.length){lastPose=hits[0].getPose(ref);reticle.visible=true;reticle.matrix.fromArray(lastPose.transform.matrix);status('Surface detected — tap once')}else{reticle.visible=false;status('Scanning flat surface…')}}if(placed)halo.material.opacity=.45+.14*Math.sin(t*.003);renderer.render(scene,camera)})}catch(e){$('launch').classList.remove('hide');$('note').textContent='AR failed: '+(e.message||e);status('AR session failed');$('guide').textContent='HTTPS is working, but this tablet/browser rejected immersive-ar + hit-test.'}};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});renderer.render(scene,camera);preflight();</script></body></html>
